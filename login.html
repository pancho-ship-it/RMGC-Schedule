<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RMGC · Agronomy</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;background:#0d1f0d;display:flex;align-items:center;justify-content:center;font-family:'DM Sans',sans-serif;
  background-image:radial-gradient(ellipse at 20% 50%,rgba(34,85,34,0.3) 0%,transparent 60%),
                   radial-gradient(ellipse at 80% 20%,rgba(20,60,20,0.4) 0%,transparent 50%)}
.card{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);border-radius:16px;padding:48px 40px;width:360px;backdrop-filter:blur(20px)}
.logo{text-align:center;margin-bottom:32px}
.logo-crest{width:56px;height:56px;background:linear-gradient(135deg,#2d6a2d,#4a9e4a);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 12px;font-size:24px}
.logo h1{font-family:'Playfair Display',serif;color:#e8f5e8;font-size:22px;letter-spacing:0.5px}
.logo p{color:#6a9e6a;font-size:12px;letter-spacing:2px;text-transform:uppercase;margin-top:4px}
label{display:block;color:#9ab89a;font-size:12px;letter-spacing:1px;text-transform:uppercase;margin-bottom:6px;margin-top:20px}
input{width:100%;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);border-radius:8px;padding:12px 14px;color:#e8f5e8;font-size:14px;font-family:'DM Sans',sans-serif;outline:none;transition:border-color 0.2s}
input:focus{border-color:#4a9e4a}
.btn{width:100%;margin-top:28px;padding:13px;background:linear-gradient(135deg,#2d6a2d,#3d8a3d);border:none;border-radius:8px;color:#e8f5e8;font-size:14px;font-weight:500;letter-spacing:0.5px;cursor:pointer;font-family:'DM Sans',sans-serif;transition:opacity 0.2s}
.btn:hover{opacity:0.85}
.error{color:#e57373;font-size:13px;margin-top:16px;text-align:center;background:rgba(229,115,115,0.1);padding:8px;border-radius:6px}
</style>
</head>
<body>
<div class="card">
  <div class="logo">
    <div class="logo-crest">⛳</div>
    <h1>RMGC Agronomy</h1>
    <p>Schedule &amp; KPIs</p>
  </div>
  <form method="POST" action="/login">
    <label>Username</label>
    <input type="text" name="username" autocomplete="username" autofocus required>
    <label>Password</label>
    <input type="password" name="password" autocomplete="current-password" required>
    <button class="btn" type="submit">Sign In</button>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
  </form>
</div>
</body>
</html>
